name: Build Simple Notes Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org=com.pamsho --project-name=pamsho_notes
      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              p.write_text(p.read_text().replace("minSdk = flutter.minSdkVersion", "minSdk = 23"))
          else:
              p = Path("android/app/build.gradle")
              if p.exists():
                  p.write_text(p.read_text().replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23"))
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: simple-notes-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
