name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org=com.pamsho --project-name=pamsho_notes
      - name: Configure AdMob Android app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find('application')
          if application is None:
              raise SystemExit('Android application tag not found in manifest')
          if not any(
              item.get(f'{{{android_ns}}}name') == 'com.google.android.gms.ads.APPLICATION_ID'
              for item in application.findall('meta-data')
          ):
              meta = ET.SubElement(application, 'meta-data')
              meta.set(f'{{{android_ns}}}name', 'com.google.android.gms.ads.APPLICATION_ID')
              meta.set(f'{{{android_ns}}}value', 'ca-app-pub-3329079275659359~2231313524')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          ET.parse(manifest)
          print('AdMob manifest XML validated successfully.')
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(g)
          else:
              gradle = Path('android/app/build.gradle')
              if gradle.exists():
                  g = gradle.read_text().replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  gradle.write_text(g)
          print('AdMob App ID configured.')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pamsho-notes-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
