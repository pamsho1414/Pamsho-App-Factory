name: Build Easy Simple Notes Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org=com.pamsho --project-name=pamsho_notes
      - name: Brand Android app and create launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main")
          manifest = root / "AndroidManifest.xml"
          source = manifest.read_text()
          source = re.sub(r'android:label="[^"]+"', 'android:label="Easy Simple Notes"', source, count=1)
          source = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', source, count=1)
          if "com.google.android.gms.ads.APPLICATION_ID" not in source:
              meta = '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3329079275659359~2231313524" />'
              source = source.replace("</application>", meta + "\n    </application>")
          manifest.write_text(source)
          res = root / "res"
          (res / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (res / "values").mkdir(parents=True, exist_ok=True)
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "values" / "ic_launcher_background.xml").write_text("""<resources><color name="ic_launcher_background">#5267D8</color></resources>""")
          foreground = """<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFF1B8" android:pathData="M28,17 L65,17 L82,34 L82,88 Q82,93 77,93 L28,93 Q23,93 23,88 L23,22 Q23,17 28,17 Z"/>
            <path android:fillColor="#F2C94C" android:pathData="M65,17 L65,31 Q65,35 69,35 L82,35 Z"/>
            <path android:fillColor="#5267D8" android:pathData="M34,45 L70,45 L70,49 L34,49 Z M34,57 L70,57 L70,61 L34,61 Z M34,69 L63,69 L63,73 L34,73 Z"/>
            <path android:fillColor="#26345F" android:pathData="M61,77 Q67,54 88,29 Q91,26 92,29 Q89,54 70,78 Q65,84 61,77 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M67,73 Q77,55 88,34 Q82,57 69,77 Z"/>
          </vector>"""
          (res / "drawable" / "ic_launcher_foreground.xml").write_text(foreground)
          adaptive = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>"""
          (res / "mipmap-anydpi-v26" / "ic_launcher.xml").write_text(adaptive)
          (res / "mipmap-anydpi-v26" / "ic_launcher_round.xml").write_text(adaptive)
          PY
      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              source = p.read_text()
              source = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              source = source.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              p.write_text(source)
          else:
              p = Path("android/app/build.gradle")
              if p.exists():
                  source = p.read_text()
                  source = source.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
                  source = source.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                  p.write_text(source)
          PY
      - run: flutter pub get
      - name: Align Android plugin compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          pub_cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          root = pub_cache / "hosted" / "pub.dev"
          changed = []
          found = []
          if root.exists():
              for package in root.iterdir():
                  android = package / "android"
                  if not android.is_dir():
                      continue
                  for path in list(android.rglob("build.gradle")) + list(android.rglob("build.gradle.kts")):
                      lines = path.read_text().splitlines()
                      output = []
                      touched = False
                      for line in lines:
                          if re.match(r"^\s*compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)\s*$", line):
                              found.append(f"{path}: {line.strip()}")
                              indent = line[:len(line) - len(line.lstrip())]
                              if path.name.endswith(".kts"):
                                  line = f"{indent}compileSdk = 36"
                              elif "compileSdkVersion" in line:
                                  line = f"{indent}compileSdkVersion 36"
                              else:
                                  line = f"{indent}compileSdk = 36"
                              touched = True
                          output.append(line)
                      if touched:
                          path.write_text("\n".join(output) + "\n")
                          changed.append(str(path))
          print(f"Found {len(found)} compileSdk declarations; updated {len(changed)} plugin modules.")
          for item in found:
              print(item)
          PY
      - run: flutter analyze
      - run: flutter test
      - name: Build smoke-test APK with Google's test banner
        run: flutter build apk --debug --dart-define=ADMOB_BANNER_AD_UNIT_ID=ca-app-pub-3940256099942544/6300978111
      - name: Cold-start test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.pamsho.pamsho_notes
            adb logcat -c
            adb shell monkey -p com.pamsho.pamsho_notes 1
            sleep 20
            APP_PID="$(adb shell pidof com.pamsho.pamsho_notes | tr -d '\r' || true)"
            echo "App process after cold start: $APP_PID"
            test -n "$APP_PID" || { echo 'App process did not remain alive after cold start.'; adb logcat -d -t 500; exit 1; }
            CRASH_LOG="$(adb logcat -d -t 1000 | grep -E 'FATAL EXCEPTION|Fatal signal [0-9]+|Process: com\.pamsho\.pamsho_notes' || true)"
            test -z "$CRASH_LOG" || { echo "$CRASH_LOG"; echo 'Fatal Android crash detected during cold start.'; exit 1; }
      - name: Build production release APK with live banner unit
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: easy-simple-notes-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
