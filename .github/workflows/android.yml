name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org=com.pamsho --project-name=pamsho_notes
      - name: Configure AdMob Android app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          marker = '    <application'
          if marker not in content:
              raise SystemExit('Android application tag not found')
          app_id = 'ca-app-pub-3329079275659359~2231313524'
          meta = f'\\n        <meta-data\\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\\n            android:value="{app_id}" />'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
              content = content.replace(marker, marker + meta, 1)
          manifest.write_text(content)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(g)
          else:
              gradle = Path('android/app/build.gradle')
              if gradle.exists():
                  g = gradle.read_text().replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
                  gradle.write_text(g)
          print('AdMob App ID configured.')
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pamsho-notes-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
